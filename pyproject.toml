[tool.poetry]
name = "mofstructure"
version = "0.1.9.0"
description = "A comprehensive Python toolkit for deconstructing metal-organic frameworks (MOFs) into building units, analysing porosity, removing unbound guest molecules, determining framework topology with RCSR net identification and generating cheminformatics descriptors for structural components."
keywords = ["guest removal", "InChIKeys", "InChI", "SMILES", "PLD", "LCD", "MOF", "COF", "zeolites", "accessible surface area", "void fraction", "coordination number", "porosity", "zeo++", "SBU", "point of extension", "topology", "cgd", "periodic graph", "systre", "topological analysis", "RCSR", "reticular chemistry structure resource", "building unit", "metal cluster", "organic linker", "topological node", "topological edge"]
authors = ["Dinga Wonanke <dak52@uclive.ac.nz>"]
license = "MIT"
readme = "README.md"

include = [
  { path = "mofstructure/bin/Systre-19.6.0.jar", format = ["sdist", "wheel"] },
  { path = "mofstructure/db/RCSRnets-2019-06-01.arc", format = ["sdist", "wheel"] },
  { path = "mofstructure/db/*.arc", format = ["sdist", "wheel"] }
]


[tool.poetry.urls]
Repository = "https://github.com/bafgreat/mofstructure"
Author-Github = "https://github.com/bafgreat"
Author-Website = "https://www.dingawonanke.com"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
ase = ">=3.19.0"
networkx = ">=2.6.3"
openbabel-wheel = "3.1.1.22"
pyzeo = ">=0.1.1"
rdkit = {version = ">=2022.9.5", optional = true}
plotly = {version = ">=5.0", optional = true}
msgpack = "^1.1.0"
omsdetector-forked = "^2026.1.6"
jdk4py = "^21.0.8.1"
kaleido = "^1.3.0"

[tool.poetry.scripts]
mofstructure = "mofstructure.scripts.buildingunits:main"
mofstructure_database = "mofstructure.scripts.collect_data:main"
mofstructure_building_units = "mofstructure.scripts.collect_building_units:main"
mofstructure_oms = "mofstructure.scripts.collect_oms:main"
mofstructure_porosity = "mofstructure.scripts.collect_porosity:main"
mofstructure_curate = "mofstructure.scripts.curate_structures:main"
mofstructure_generate_cgd="mofstructure.generate_cgd:main"
mofstructure_systre_cgd="mofstructure.scripts.systre_cgd:main"
mofstructure_topology = "mofstructure.scripts.systre_cli:main"
mofstructure_fingerprint = "mofstructure.scripts.fingerprint:main"
cof_stacking = "mofstructure.cof_stacking:Main"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
pytest = "^8.3.2"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.0.2"
sphinxcontrib-mermaid = "^0.9.2"
sphinx-copybutton = "^0.5.2"

[tool.poetry.extras]
rdkit = ["rdkit"]
draw = ["plotly"]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry.core.masonry.api"
